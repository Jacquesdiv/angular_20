<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>depth 5 | /l1/l2/l3/l4/l5</title>
<!-- root-absolute: must resolve identically from every depth -->
<link rel="stylesheet" href="/shared/global.css">
<!-- relative, in this folder -->
<link rel="stylesheet" href="css/style-5.css">
</head>
<body data-page="/l1/l2/l3/l4/l5" data-depth="5">
  <h1>/l1/l2/l3/l4/l5</h1>
  <p class="depth">folder depth 5 &middot; document <code>l1/l2/l3/l4/l5/index.html</code></p>

  <div class="probe" id="global-css-probe">root-absolute CSS <code>/shared/global.css</code></div>
  <div class="probe" id="rel-css-probe">relative CSS <code>css/style-5.css</code></div>
  <div class="probe pending" id="js-probe">relative JS <code>js/script-5.js</code></div>
  <div class="probe pending" id="img-probe">relative image <code>img/dot-5.svg</code></div>
  <div class="probe pending" id="up-probe">parent-relative <code>../../../../../shared/logo.svg</code></div>
  <div class="probe pending" id="json-probe">root-absolute fetch <code>/data/products.json</code></div>

  <img src="img/dot-5.svg" alt="" id="img" width="40" height="40" style="display:none">
  <img src="../../../../../shared/logo.svg" alt="" id="upimg" width="40" height="40" style="display:none">
  <script src="js/script-5.js"></script>
  <script>
    const mark = (img, probe) => {
      const hit = () => document.getElementById(probe).className = 'probe ok';
      if (img.complete && img.naturalWidth > 0) hit(); else img.onload = hit;
    };
    mark(document.getElementById('img'), 'img-probe');
    mark(document.getElementById('upimg'), 'up-probe');
    fetch('/data/products.json').then(r=>r.ok?r.json():Promise.reject())
      .then(()=>document.getElementById('json-probe').className='probe ok').catch(()=>{});
  </script>
</body></html>
