<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>depth 4 | /l1/l2/l3/l4</title>
<!-- root-absolute: must resolve identically from every depth -->
<link rel="stylesheet" href="/shared/global.css">
<!-- relative, in this folder -->
<link rel="stylesheet" href="css/style-4.css">
</head>
<body data-page="/l1/l2/l3/l4" data-depth="4">
  <h1>/l1/l2/l3/l4</h1>
  <p class="depth">folder depth 4 &middot; document <code>l1/l2/l3/l4/index.html</code></p>

  <div class="probe" id="global-css-probe">root-absolute CSS <code>/shared/global.css</code></div>
  <div class="probe" id="rel-css-probe">relative CSS <code>css/style-4.css</code></div>
  <div class="probe pending" id="js-probe">relative JS <code>js/script-4.js</code></div>
  <div class="probe pending" id="img-probe">relative image <code>img/dot-4.svg</code></div>
  <div class="probe pending" id="up-probe">parent-relative <code>../../../../shared/logo.svg</code></div>
  <div class="probe pending" id="json-probe">root-absolute fetch <code>/data/products.json</code></div>

  <img src="img/dot-4.svg" alt="" id="img" width="40" height="40" style="display:none">
  <img src="../../../../shared/logo.svg" alt="" id="upimg" width="40" height="40" style="display:none">
  <script src="js/script-4.js"></script>
  <script>
    document.getElementById('img').onload = () => document.getElementById('img-probe').className='probe ok';
    document.getElementById('upimg').onload = () => document.getElementById('up-probe').className='probe ok';
    fetch('/data/products.json').then(r=>r.ok?r.json():Promise.reject())
      .then(()=>document.getElementById('json-probe').className='probe ok').catch(()=>{});
  </script>
</body></html>
